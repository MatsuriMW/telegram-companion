name: release plugin

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
  
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: true

    - name: Build
      run: pnpm build
    
    # Lets anyone verify that the release files were built from this repository.
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          subject-path: |
              main.js
              manifest.json
              styles.css

    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          draft: false
          generate_release_notes: true
          files: |
              main.js
              manifest.json
              styles.css
